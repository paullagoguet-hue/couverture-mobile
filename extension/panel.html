<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérifier la couverture réseau</title>
    <style>
      :root {
        --text: #1d2327;
        --muted: #5b6770;
        --border: #e1e6e9;
        --bg: #f4f7f8;
        --card: #fff;
        --accent: #1a5f7a;
        --accent-dark: #134a60;
        --accent-soft: #e5f1f5;
        --orange: #e86f0c;
        --best: #f0f8fb;
        --radius: 12px;
        --shadow: 0 1px 2px rgba(16, 40, 52, 0.06), 0 2px 8px rgba(16, 40, 52, 0.05);
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 0 16px;
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      main { padding: 0 12px; }
      button { font: inherit; }
      .icon { width: 18px; height: 18px; flex: none; }

      /* En-tête */
      header {
        position: sticky; top: 0; z-index: 20;
        padding: 12px 12px 10px; background: var(--card); border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; }
      .brand > div { flex: 1; }
      .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: none; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
      .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
      .brand svg { width: 28px; height: 28px; flex: none; }
      .brand strong { display: block; font-size: 15px; line-height: 1.2; }
      .brand small { display: block; font-size: 11.5px; color: var(--muted); }

      /* Recherche */
      #search { position: relative; }
      .search-row { display: flex; gap: 6px; }
      .search-field { position: relative; flex: 1; min-width: 0; }
      .search-field .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
      .search-field input {
        width: 100%; font: inherit; padding: 8px 10px 8px 34px;
        border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
        transition: border-color 0.15s, background 0.15s;
      }
      .search-field input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
      .search-row > button {
        font-weight: 600; padding: 8px 13px; cursor: pointer;
        border: none; border-radius: 10px; background: var(--accent); color: #fff;
      }
      .search-row > button:hover { background: var(--accent-dark); }
      .countries { display: flex; gap: 6px; margin-bottom: 8px; }
      .countries button {
        display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; cursor: pointer;
        border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--muted); font-size: 12px;
      }
      .countries button[aria-checked='true'] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .flag-icon { width: 18px; height: 12px; flex: none; border-radius: 2px; }
      .place-head .flag { margin-left: auto; display: inline-flex; }
      .suggestions {
        position: absolute; z-index: 30; left: 0; right: 0; margin: 4px 0 0; padding: 4px; list-style: none;
        background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      }
      .suggestions button {
        display: block; width: 100%; text-align: left; padding: 6px 9px;
        border: none; border-radius: 6px; background: none; cursor: pointer; color: inherit;
      }
      .suggestions button:hover, .suggestions button:focus { background: var(--accent-soft); outline: none; }
      .suggestions small { display: block; color: var(--muted); font-size: 12px; }

      /* Cartes de contenu */
      .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; margin-top: 12px; }
      #result { animation: appear 0.18s ease-out; }
      @keyframes appear { from { opacity: 0; transform: translateY(4px); } }

      /* Accueil */
      .hero { display: block; width: 100%; height: auto; margin: 12px 0 0; border-radius: var(--radius); }
      .welcome h2 { font-size: 17px; margin: 14px 2px 4px; }
      .welcome .lead { margin: 0 2px 4px; color: var(--muted); }
      .steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      .steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
      .steps .bubble { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
      .steps strong { display: block; font-size: 13.5px; }
      .steps span { font-size: 12.5px; color: var(--muted); }
      .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 10px; }
      .examples { display: flex; flex-wrap: wrap; gap: 6px; }
      .examples button {
        padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px; background: #fff; cursor: pointer; font-size: 12.5px; color: var(--accent);
      }
      .examples button:hover { border-color: var(--accent); background: var(--accent-soft); }

      /* Chargement */
      .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); margin: 14px 2px 0; }
      .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .skeleton { display: grid; gap: 8px; }
      .skeleton i { display: block; height: 38px; border-radius: 9px; background: linear-gradient(90deg, #eef2f4 25%, #f7f9fa 50%, #eef2f4 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
      @keyframes shimmer { to { background-position: -200% 0; } }

      /* Messages (erreur, conseil) */
      .message { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
      .message .bubble { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
      .message.error .bubble { background: #fdecea; color: #b3261e; }
      .message strong { display: block; margin-bottom: 2px; }
      .message p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
      .message .detail { font-size: 11.5px; }
      .btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; cursor: pointer; text-decoration: none;
        border: 1px solid var(--accent); border-radius: 9px; background: #fff; color: var(--accent); font-weight: 600; font-size: 13px;
      }
      .btn:hover { background: var(--accent-soft); }
      .btn .icon { width: 16px; height: 16px; }

      /* Choix entre plusieurs lieux */
      .choices { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
      .choices button {
        width: 100%; text-align: left; cursor: pointer; display: flex; gap: 8px; align-items: center;
        padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: #fff;
      }
      .choices button:hover { border-color: var(--accent); background: var(--best); }
      .choices .icon { color: var(--accent); }
      .choices small { display: block; color: var(--muted); }

      /* Lieu */
      .from-page { font-size: 12px; color: var(--muted); background: #fff6ee; border: 1px solid #f6d9bf; border-radius: 10px; padding: 7px 10px; margin: 12px 0 0; }
      .place-head { display: flex; gap: 8px; align-items: flex-start; }
      .place-head .icon { color: #b3261e; margin-top: 1px; }
      h2 { font-size: 15.5px; margin: 0; line-height: 1.3; }
      .warning { background: #fff6d6; padding: 7px 9px; border-radius: 8px; font-size: 12.5px; margin: 10px 0 0; }
      .area-note { font-size: 12px; color: var(--muted); margin: 6px 0 0 26px; }

      /* Verdicts par opérateur */
      .best-text { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 13.5px; }
      .best-text .icon { color: #f2a900; width: 17px; height: 17px; }
      .operators { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
      .cell {
        width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 7px 7px 7px 11px; cursor: pointer; text-align: left;
        border: 1px solid var(--border); border-radius: 10px; background: #fff; color: inherit;
        transition: border-color 0.12s, box-shadow 0.12s;
      }
      .cell:hover:not(:disabled) { border-color: #b9c7ce; }
      .cell:disabled { cursor: default; }
      .cell.best { background: var(--best); }
      .cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
      .op-name { font-weight: 600; display: flex; flex-direction: column; }
      .badge { font-size: 11px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 3px; }
      .badge .icon { width: 12px; height: 12px; color: #f2a900; }
      .pill { min-width: 112px; text-align: center; font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }

      /* Mini-carte */
      .map-caption { margin: 0 0 8px; font-size: 13px; }
      .map-caption small { color: var(--muted); }
      #minimap { height: 230px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
      .map-actions { margin-top: 10px; }

      .source { color: var(--muted); font-size: 11.5px; margin: 12px 2px 0; }

      /* Encart publicitaire (sous le résultat) */
      .encart { margin-top: 14px; padding: 8px 10px 10px; border: 1px dashed #cfd8dc; border-radius: 10px; background: #fafbfb; }
      .encart-mention { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
      .encart a { display: flex; gap: 10px; align-items: center; color: inherit; text-decoration: none; font-size: 13px; }
      .encart a:hover strong, .encart a:focus strong { text-decoration: underline; }
      .encart img { width: 56px; height: 56px; object-fit: contain; border-radius: 6px; flex: none; }
      .encart strong { display: block; color: var(--accent); }

      /* Page d'infos */
      .back { margin-top: 12px; padding: 4px 0; border: none; background: none; color: var(--accent); font-weight: 600; cursor: pointer; }
      .legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      .legend li { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; font-size: 12.5px; }
      .legend .pill { min-width: 0; font-size: 12px; padding: 4px 6px; }
      .facts { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 12.5px; }
      .hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
      .hint .icon { width: 13px; height: 13px; color: #f2a900; vertical-align: -2px; }
      #info h3 + p.hint { margin-top: 0; }
      #info h3.next { margin-top: 14px; }
      #version { margin: 12px 2px 0; font-size: 11px; color: var(--muted); }
      .link { padding: 0; border: none; background: none; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: inherit; }
      .card-option { font-size: 12.5px; }
      .card-option { display: flex; gap: 8px; align-items: center; cursor: pointer; }
      .switch { position: relative; width: 30px; height: 17px; flex: none; }
      .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
      .switch span { position: absolute; inset: 0; border-radius: 999px; background: #c6d0d5; transition: background 0.15s; pointer-events: none; }
      .switch span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
      .switch input:checked + span { background: var(--accent); }
      .switch input:checked + span::after { transform: translateX(13px); }
      .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

      button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        #result, .spinner, .skeleton i { animation: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#1a5f7a" />
          <rect x="5.4" y="18.9" width="3.8" height="7.7" rx="0.8" fill="#fff" /><rect x="11.2" y="14.8" width="3.8" height="11.8" rx="0.8" fill="#fff" />
          <rect x="17" y="10.7" width="3.8" height="15.9" rx="0.8" fill="#fff" /><rect x="22.7" y="6.6" width="3.8" height="20" rx="0.8" fill="#fff" />
        </svg>
        <div><strong>Vérifier la couverture réseau</strong><small>4G et 5G · données publiques</small></div>
        <button id="info-open" class="icon-btn" type="button" title="Infos et sources" aria-label="Infos et sources">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" /><path d="M12 11v5.5M12 7.5h.01" /></svg>
        </button>
      </div>
      <div id="countries" class="countries" role="radiogroup" aria-label="Pays de la recherche">
        <button type="button" role="radio" data-country="fr" aria-checked="true"><svg class="flag-icon" viewBox="0 0 18 12" aria-hidden="true"><rect width="6" height="12" fill="#0055a4"/><rect x="6" width="6" height="12" fill="#fff"/><rect x="12" width="6" height="12" fill="#ef4135"/><rect width="18" height="12" rx="1.5" fill="none" stroke="rgba(0,0,0,.15)"/></svg>France</button>
        <button type="button" role="radio" data-country="es" aria-checked="false"><svg class="flag-icon" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="12" fill="#aa151b"/><rect y="3" width="18" height="6" fill="#f1bf00"/><rect width="18" height="12" rx="1.5" fill="none" stroke="rgba(0,0,0,.15)"/></svg>Espagne</button>
      </div>
      <form id="search" role="search" autocomplete="off">
        <div class="search-row">
          <div class="search-field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
            <input type="search" name="q" placeholder="Adresse ou commune" aria-label="Adresse ou commune" maxlength="200" />
          </div>
          <button type="submit">Vérifier</button>
        </div>
        <ul class="suggestions" role="listbox" hidden></ul>
      </form>
    </header>
    <main>
      <div id="result" aria-live="polite"></div>
      <div id="info" hidden>
        <button class="back" type="button">← Retour</button>
        <div id="info-content"></div>
        <section class="card">
          <h3>Réglage</h3>
          <label class="card-option" hidden>
            <span class="switch"><input id="card-enabled" type="checkbox" /><span></span></span>
            Proposer la vérification directement sur les pages d'annonces
          </label>
        </section>
        <p id="version"></p>
      </div>
    </main>
    <script type="module" src="./src/panel.ts"></script>
  </body>
</html>
