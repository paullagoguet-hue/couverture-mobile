<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérifier la couverture réseau</title>
    <style>
      :root {
        --text: #1d2327;
        --muted: #5b6770;
        --border: #dde1e4;
        --best: #eef6f9;
        --accent: #1a5f7a;
        --none: #d9d9d9;
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 12px 14px 16px;
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: #fff;
      }
      h1 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.03em; }
      h2 { font-size: 16px; margin: 0 0 8px; }
      .status { color: var(--muted); }
      .error { color: #b3261e; }
      .warning { background: #fff4d6; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
      .best-text { margin: 8px 0; }

      /* Liste de choix quand plusieurs lieux correspondent */
      .choices { list-style: none; padding: 0; margin: 0; }
      .choices li { margin-bottom: 6px; }
      .choices button {
        width: 100%; text-align: left; font: inherit; cursor: pointer;
        padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff;
      }
      .choices button:hover { border-color: var(--accent); }
      .choices small { display: block; color: var(--muted); }

      /* Tableau opérateurs × technos */
      .coverage { width: 100%; border-collapse: collapse; margin: 4px 0 12px; table-layout: fixed; }
      .coverage col.op { width: 38%; }
      .coverage th, .coverage td { padding: 3px 4px; border-bottom: 1px solid var(--border); text-align: left; }
      .coverage thead th { font-size: 12px; color: var(--muted); font-weight: 600; }
      .coverage th[scope='row'] { font-weight: 600; }
      .coverage tr.best { background: var(--best); }
      .badge { display: block; font-size: 11px; font-weight: 600; color: var(--accent); }
      .cell {
        display: flex; align-items: center; gap: 6px; width: 100%;
        font: inherit; font-size: 13px; text-align: left; cursor: pointer;
        padding: 3px 5px; border: 1px solid transparent; border-radius: 4px; background: none; color: inherit;
      }
      .cell:hover:not(:disabled) { border-color: var(--border); }
      .cell.selected { border-color: var(--accent); background: #fff; }
      .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0, 0, 0, 0.12); }

      /* Mini-carte */
      .map-caption { margin: 0 0 4px; font-size: 13px; }
      .map-caption small { color: var(--muted); }
      #minimap { height: 240px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }

      .note, .source { color: var(--muted); font-size: 12px; }
      .note { margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Vérifier la couverture réseau</h1>
    <div id="result">
      <p>Sélectionnez une adresse ou un nom de commune sur une page, puis faites un clic droit
        et choisissez « Vérifier la couverture réseau ».</p>
    </div>
    <script type="module" src="./src/panel.ts"></script>
  </body>
</html>
