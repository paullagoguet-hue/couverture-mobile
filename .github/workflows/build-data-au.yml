# Construit les tuiles PMTiles de couverture mobile pour l'Australie, à partir
# des cartes de couverture déclarées à l'ACCC (cf. data-pipeline/au/build_au.sh).
#
# Lancement manuel : onglet Actions > « Données de couverture (Australie) » > Run workflow.
name: Données de couverture (Australie)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-data-au
  cancel-in-progress: false

jobs:
  build:
    name: Tuiles Australie
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Cache des outils compilés (tippecanoe, pmtiles)
        uses: actions/cache@v6
        with:
          path: data-pipeline/.tools
          key: tools-ubuntu-24.04-${{ hashFiles('data-pipeline/env.sh') }}

      - name: Dépendances
        run: bash data-pipeline/install_deps.sh

      - name: Construction
        env:
          TILES_DIR: ${{ github.workspace }}/tiles
          WORK_DIR: ${{ runner.temp }}/work
        run: bash data-pipeline/au/build_au.sh

      - name: Résumé
        run: |
          {
            echo "### Australie : $(jq '.layers | length' tiles/au/manifest.json) couche(s)"
            echo "| couche | Mo | tuiles z12 | max z12 (Ko) |"
            echo "|---|---:|---:|---:|"
            for s in tiles/au/*.stats.json; do
              id=$(basename "$s" .stats.json)
              echo "| $id | $(jq -r .file_mb "$s") | $(jq -r '.by_zoom["12"].tiles // "-"' "$s") | $(jq -r '.by_zoom["12"].max_kb // "-"' "$s") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: tiles-au
          path: tiles/au/
          compression-level: 0
          retention-days: 14
